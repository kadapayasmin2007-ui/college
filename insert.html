```html
<!DOCTYPE html>
<html>
<head>
    <title>Insert Student</title>
</head>
<body>

    <h1>INSERT STUDENT DETAILS</h1>
    <hr>

    <a href="index.html">Home</a> |
    <a href="list.html">List Students</a> |
    <a href="insert.html">Insert Student</a>

    <hr>

    <form id="insertForm">
        <label>Student Number:</label>
        <input type="number" id="sno" required>
        <br><br>

        <label>Name:</label>
        <input type="text" id="name" required>
        <br><br>

        <label>Age:</label>
        <input type="number" id="age" min="1" max="120" required>
        <br><br>

        <label>Phone Number:</label>
        <input
            type="tel"
            id="phone"
            pattern="[0-9]{10}"
            maxlength="10"
            required
        >
        <br><br>

        <label>Total:</label>
        <input type="number" id="total" required>
        <br><br>

        <button type="submit">Insert Student</button>
    </form>

    <p id="message"></p>

    <script>
        document.getElementById("insertForm").addEventListener("submit", async function(event) {
            event.preventDefault();

            const student = {
                sno: document.getElementById("sno").value,
                name: document.getElementById("name").value.trim(),
                age: Number(document.getElementById("age").value),
                phone: document.getElementById("phone").value,
                total: Number(document.getElementById("total").value)
            };

            const message = document.getElementById("message");

            try {
                const response = await fetch("/students", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(student)
                });

                const result = await response.text();

                if (!response.ok) {
                    throw new Error(result);
                }

                message.textContent = "Student inserted successfully!";
                this.reset();

            } catch (error) {
                message.textContent = "Error: " + error.message;
            }
        });
    </script>

</body>
</html>
